<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JavaScript Assignment 5</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <script src="script.js" defer></script>
  </head>
  <body>
    <main>
      <h1>JavaScript Basics</h1>

      <section>
        <h2>Part 1 and 2: My Profile</h2>
        <p class="form-label">Name: <span id="profile-name"></span></p>
        <p class="form-label">Age: <span id="profile-age"></span></p>
        <p class="form-label">Hobbies: <span id="hobby-count"></span></p>

        <form id="profile-form" class="d-flex flex-column gap-1">
          <label for="username" class="form-label">Username:</label>
          <input id="username" type="text" class="form-control" required placeholder="Enter your username" />

          <label for="birth-year" class="form-label">Birth year:</label>
          <input id="birth-year" type="number" class="form-control" min="1900" required placeholder="Enter your birth year" />

          <button type="submit" class="btnn  mt-2">Create </button>
        </form>
      </section>

      <section>
        <h2>Part 3: My Hobbies</h2>
        <ul id="hobby-list"></ul>

        <form id="hobby-form">
          <label for="new-hobby" class="form-label">New hobby:</label>
          <input id="new-hobby" type="text" class="form-control" required placeholder="Enter a new hobby" />
          <div class="d-flex gap-3">
            <button type="submit" class="btnn mt-2">Add Item</button>
            <button id="remove-button" type="button" class="btn btn-outline-secondary mt-2">Remove Item</button>
          </div>
        </form>
      </section>
    </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
